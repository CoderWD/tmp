<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wi-Fi File Manager</title>
    <style>
        :root {
            --bg: #f2f4f8;
            --surface: #ffffff;
            --surface-2: #f8fafc;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-muted: #64748b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-soft: rgba(37, 99, 235, 0.1);
            --success: #16a34a;
            --success-soft: rgba(22, 163, 74, 0.12);
            --danger: #dc2626;
            --danger-soft: rgba(220, 38, 38, 0.12);
            --warning: #d97706;
            --shadow: 0 10px 40px rgba(15, 23, 42, 0.08);
            --radius: 14px;
            --radius-sm: 10px;
            --header-h: 64px;
            --toolbar-h: 56px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b1220;
                --surface: #111827;
                --surface-2: #1f2937;
                --border: #334155;
                --text: #f8fafc;
                --text-muted: #94a3b8;
                --accent: #3b82f6;
                --accent-hover: #60a5fa;
                --accent-soft: rgba(59, 130, 246, 0.15);
                --success-soft: rgba(34, 197, 94, 0.15);
                --danger-soft: rgba(239, 68, 68, 0.15);
                --shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }

        .app {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            display: grid;
            place-items: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .brand h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.15s, background 0.15s, opacity 0.15s;
            white-space: nowrap;
        }

        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

        .btn-secondary {
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover:not(:disabled) { background: var(--accent-soft); }

        .btn-danger {
            background: var(--danger-soft);
            color: var(--danger);
            border: 1px solid transparent;
        }

        .btn-danger:hover:not(:disabled) { background: var(--danger); color: #fff; }

        .btn-sm { padding: 7px 12px; font-size: 0.8125rem; }
        .hidden { display: none !important; }

        .btn-icon {
            width: 38px;
            height: 38px;
            padding: 0;
            justify-content: center;
        }

        .main-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 520px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 180px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface-2);
            color: var(--text);
            font-size: 0.875rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            opacity: 0.7;
        }

        .toolbar-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        select.sort-select {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface-2);
            color: var(--text);
            font-size: 0.875rem;
            cursor: pointer;
        }

        .view-toggle {
            display: flex;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        .view-toggle button {
            border: none;
            background: var(--surface-2);
            color: var(--text-muted);
            padding: 9px 12px;
            cursor: pointer;
            font-size: 0.875rem;
        }

        .view-toggle button.active {
            background: var(--accent-soft);
            color: var(--accent);
            font-weight: 600;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 18px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            font-size: 0.875rem;
        }

        .breadcrumb button {
            border: none;
            background: none;
            color: var(--accent);
            cursor: pointer;
            font-weight: 600;
            padding: 4px 6px;
            border-radius: 6px;
        }

        .breadcrumb button:hover { background: var(--accent-soft); }
        .breadcrumb span.sep { color: var(--text-muted); }
        .breadcrumb span.current { color: var(--text-muted); font-weight: 500; }

        .selection-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 18px;
            background: var(--accent-soft);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .selection-bar.visible { display: flex; }

        .selection-bar .count { font-weight: 600; font-size: 0.875rem; }

        .selection-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        .content-area {
            flex: 1;
            overflow: auto;
            position: relative;
        }

        .loading-state, .empty-state, .error-state {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 64px 24px;
            color: var(--text-muted);
            text-align: center;
            min-height: 280px;
        }

        .loading-state.visible, .empty-state.visible, .error-state.visible { display: flex; }

        .empty-icon { font-size: 48px; opacity: 0.6; }

        .file-list {
            display: none;
        }

        .file-list.visible { display: block; }

        .file-list.list-view .file-row {
            display: grid;
            grid-template-columns: 36px 40px minmax(0, 1fr) 88px minmax(168px, auto) minmax(220px, auto);
            align-items: center;
            gap: 10px 12px;
            padding: 12px 18px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.12s;
        }

        .file-list.list-view .col-check {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .file-list.list-view .file-row-icon {
            font-size: 2rem;
            line-height: 1;
            text-align: center;
            flex-shrink: 0;
        }

        .file-list.list-view .col-name {
            min-width: 0;
        }

        .file-list.list-view .col-size {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-list.list-view .col-date {
            min-width: 168px;
            font-size: 0.8125rem;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            line-height: 1.35;
        }

        .file-list.list-view .file-row:hover { background: var(--surface-2); }
        .file-list.list-view .file-row.selected { background: var(--accent-soft); }

        .file-list.list-view .file-row.header-row {
            cursor: default;
            background: var(--surface-2);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            position: sticky;
            top: 0;
            z-index: 2;
        }

        .file-list.list-view .file-row.header-row:hover { background: var(--surface-2); }

        .file-list.grid-view {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 14px;
            padding: 18px;
        }

        .file-list.grid-view.visible {
            display: grid;
        }

        .file-list.list-view.visible {
            display: block;
        }

        .file-card {
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px;
            background: var(--surface-2);
            cursor: pointer;
            transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
            position: relative;
        }

        .file-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
            border-color: var(--accent);
        }

        .file-card.selected {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .file-icon {
            font-size: 2.25rem;
            line-height: 1;
            margin-bottom: 10px;
        }

        .file-name {
            font-weight: 600;
            font-size: 0.875rem;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .file-meta {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-top: 6px;
        }

        .checkbox {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .row-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            flex-shrink: 0;
            min-width: 248px;
        }

        .row-actions .btn {
            padding: 6px 10px;
            font-size: 0.75rem;
        }

        .upload-panel {
            border-top: 1px solid var(--border);
            padding: 18px;
            background: var(--surface-2);
        }

        .upload-panel summary {
            cursor: pointer;
            font-weight: 600;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .upload-panel summary::-webkit-details-marker { display: none; }

        .upload-area {
            margin-top: 14px;
            border: 2px dashed var(--accent);
            border-radius: var(--radius-sm);
            padding: 32px 20px;
            text-align: center;
            transition: all 0.2s;
            background: var(--surface);
        }

        .upload-area.dragover {
            border-color: var(--success);
            background: var(--success-soft);
        }

        .upload-area input[type="file"] { display: none; }

        .progress-container {
            margin-top: 14px;
            display: none;
        }

        .progress-container.visible { display: block; }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--success));
            width: 0%;
            transition: width 0.25s;
        }

        .progress-text {
            margin-top: 8px;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay.visible { display: flex; }

        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 440px;
            border: 1px solid var(--border);
            overflow: hidden;
            animation: modalIn 0.2s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: none; }
        }

        .modal-header {
            padding: 18px 20px 0;
            font-size: 1.05rem;
            font-weight: 700;
        }

        .modal-body {
            padding: 16px 20px;
        }

        .modal-body input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface-2);
            color: var(--text);
            font-size: 0.9375rem;
            outline: none;
        }

        .modal-body input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .modal-body p.hint {
            margin-top: 10px;
            font-size: 0.8125rem;
            color: var(--text-muted);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 0 20px 18px;
        }

        .move-list {
            max-height: 280px;
            overflow: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-top: 10px;
        }

        .move-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }

        .move-item:last-child { border-bottom: none; }
        .move-item:hover { background: var(--surface-2); }
        .move-item.active { background: var(--accent-soft); }

        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: min(360px, calc(100vw - 32px));
        }

        .toast {
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            font-size: 0.875rem;
            animation: toastIn 0.25s ease;
        }

        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(12px); }
            to { opacity: 1; transform: none; }
        }

        /* —— Drag & drop —— */
        .drop-overlay {
            display: none;
            position: absolute;
            inset: 12px;
            border: 3px dashed var(--accent);
            border-radius: var(--radius);
            background: rgba(37, 99, 235, 0.08);
            z-index: 20;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            backdrop-filter: blur(2px);
        }

        .drop-overlay.visible { display: flex; }

        .drop-overlay-icon { font-size: 52px; line-height: 1; }
        .drop-overlay-title {
            font-size: 1.125rem;
            font-weight: 700;
            text-align: center;
            padding: 0 24px;
        }
        .drop-overlay-hint {
            color: var(--text-muted);
            font-size: 0.875rem;
            text-align: center;
            padding: 0 24px;
        }

        .file-row.drop-target,
        .file-card.drop-target {
            outline: 3px solid var(--success);
            outline-offset: -2px;
            background: var(--success-soft) !important;
            transform: scale(1.01);
        }

        .file-row.drop-target::after,
        .file-card.drop-target::after {
            content: attr(data-drop-hint);
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--success);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 999px;
            pointer-events: none;
            z-index: 3;
            max-width: 45%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-card.drop-target::after {
            right: 10px;
            top: auto;
            bottom: 10px;
            transform: none;
            max-width: calc(100% - 20px);
        }

        .file-row, .file-card { position: relative; }

        .file-row[draggable="true"],
        .file-card[draggable="true"] {
            cursor: grab;
        }

        .file-row.dragging,
        .file-card.dragging {
            opacity: 0.45;
        }

        .file-list.list-view .file-row.header-row .sortable {
            cursor: pointer;
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .file-list.list-view .file-row.header-row .sortable:hover {
            color: var(--accent);
        }

        .sort-indicator {
            font-size: 0.65rem;
            opacity: 0.85;
        }

        /* Context menu */
        .context-menu {
            display: none;
            position: fixed;
            z-index: 300;
            min-width: 180px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            padding: 6px;
            animation: modalIn 0.15s ease;
        }

        .context-menu.visible { display: block; }

        .context-menu button {
            width: 100%;
            border: none;
            background: none;
            color: var(--text);
            text-align: left;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.875rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .context-menu button:hover { background: var(--surface-2); }
        .context-menu button.danger { color: var(--danger); }
        .context-menu hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 4px 0;
        }

        /* Upload queue */
        .upload-queue {
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 150;
            width: min(320px, calc(100vw - 48px));
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        .upload-queue.visible { display: flex; }

        .upload-job {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            padding: 12px 14px;
        }

        .upload-job-title {
            font-size: 0.8125rem;
            font-weight: 600;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .upload-job-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .empty-state.drop-hint-visible .empty-icon { animation: bounce 1.2s ease infinite; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .toolbar-hint {
            width: 100%;
            font-size: 0.8125rem;
            color: var(--text-muted);
            padding: 0 18px 10px;
            border-bottom: 1px solid var(--border);
        }

        @media (max-width: 768px) {
            .file-list.list-view .file-row {
                grid-template-columns: 32px 36px 1fr auto;
            }
            .file-list.list-view .col-size,
            .file-list.list-view .col-date,
            .file-list.list-view .header-row .col-size,
            .file-list.list-view .header-row .col-date {
                display: none;
            }
            .file-list.list-view .file-row-icon {
                font-size: 1.75rem;
            }
            .header { padding: 16px; }
            .brand h1 { font-size: 1.05rem; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="brand">
                <div class="brand-icon">📱</div>
                <div>
                    <h1 id="pageTitle">Wi-Fi File Manager</h1>
                    <p id="pageSubtitle"></p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" id="refreshBtn">↻</button>
                <button class="btn btn-secondary" id="newFolderBtn"></button>
                <button class="btn btn-primary" id="uploadToggleBtn"></button>
            </div>
        </header>

        <section class="main-panel">
            <div class="toolbar">
                <button class="btn btn-secondary btn-icon" id="backBtn" type="button" title="">↑</button>
                <div class="search-box">
                    <input type="search" id="searchInput" autocomplete="off">
                </div>
                <div class="toolbar-group">
                    <select class="sort-select" id="sortSelect"></select>
                    <div class="view-toggle">
                        <button type="button" id="listViewBtn" title="List"></button>
                        <button type="button" id="gridViewBtn" title="Grid"></button>
                    </div>
                </div>
            </div>
            <p class="toolbar-hint" id="toolbarHint"></p>

            <nav class="breadcrumb" id="breadcrumb"></nav>

            <div class="selection-bar" id="selectionBar">
                <span class="count" id="selectionCount"></span>
                <div class="selection-actions">
                    <button class="btn btn-secondary btn-sm" id="selectAllBtn"></button>
                    <button class="btn btn-secondary btn-sm" id="deselectAllBtn"></button>
                    <button class="btn btn-secondary btn-sm hidden" id="downloadSelectedBtn"></button>
                    <button class="btn btn-secondary btn-sm hidden" id="renameSelectedBtn"></button>
                    <button class="btn btn-secondary btn-sm hidden" id="moveSelectedBtn"></button>
                    <button class="btn btn-danger btn-sm" id="deleteSelectedBtn"></button>
                </div>
            </div>

            <div class="content-area" id="contentArea">
                <div class="drop-overlay" id="dropOverlay">
                    <div class="drop-overlay-icon">📥</div>
                    <div class="drop-overlay-title" id="dropOverlayTitle"></div>
                    <div class="drop-overlay-hint" id="dropOverlayHint"></div>
                </div>
                <div class="loading-state" id="loadingState">
                    <div class="empty-icon">⏳</div>
                    <p id="loadingText"></p>
                </div>
                <div class="error-state" id="errorState">
                    <div class="empty-icon">⚠️</div>
                    <p id="errorText"></p>

                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">📂</div>
                    <p id="emptyText"></p>
                </div>
                <div class="file-list list-view" id="fileList"></div>

            <details class="upload-panel" id="uploadPanel">
                <summary id="uploadSummary"></summary>
                <div class="upload-area" id="uploadArea">
                    <p id="uploadHint"></p>

                    <button class="btn btn-primary" id="selectFilesBtn"></button>

                    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                    <div class="progress-text" id="progressText"></div>
                </div>
            </details>
        </section>
    </div>

    <div class="modal-overlay" id="folderModal">
        <div class="modal">
            <div class="modal-header" id="folderModalTitle"></div>
            <div class="modal-body">
                <input type="text" id="folderNameInput" maxlength="255">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-close-modal></button>
                <button class="btn btn-primary" id="folderConfirmBtn"></button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="renameModal">
        <div class="modal">
            <div class="modal-header" id="renameModalTitle"></div>
            <div class="modal-body">
                <input type="text" id="renameInput" maxlength="255">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-close-modal></button>
                <button class="btn btn-primary" id="renameConfirmBtn"></button>
            </div>
        </div>

    <div class="modal-overlay" id="moveModal">
        <div class="modal">
            <div class="modal-header" id="moveModalTitle"></div>
            <div class="modal-body">
                <p class="hint" id="moveHint"></p>
                <div class="move-list" id="moveList"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-close-modal></button>
                <button class="btn btn-primary" id="moveConfirmBtn"></button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <div class="modal-header" id="confirmTitle"></div>
            <div class="modal-body">
                <p id="confirmMessage"></p>
                <p class="hint" id="confirmHint" style="display:none;"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-close-modal></button>
                <button class="btn btn-danger" id="confirmOkBtn"></button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <div class="context-menu" id="contextMenu"></div>
    <div class="upload-queue" id="uploadQueue"></div>

    <script>
        const i18n = /*__I18N__*/;
        const INITIAL_PATH = "/*__INITIAL_PATH__*/";

        const t = (key, replacements = {}) => {
            let text = i18n[key] || key;
            Object.entries(replacements).forEach(([k, v]) => {
                text = text.split('${' + k + '}').join(v);
            });
            return text;
        };

        const state = {
            currentPath: INITIAL_PATH || '',
            parentPath: '',
            items: [],
            filteredItems: [],
            selected: new Set(),
            viewMode: localStorage.getItem('fm_view') || 'list',
            sortBy: localStorage.getItem('fm_sort') || 'name',
            sortAsc: localStorage.getItem('fm_sortAsc') !== 'false',
            loading: false,
            moveSourcePath: null,
            moveTargetPath: '',
            renamePath: null,
            externalDragDepth: 0,
            internalDragPath: null,
            uploadJobs: new Map(),
            contextTarget: null,
        };

        const FM_PATH_TYPE = 'application/x-fm-item-path';

        const els = {
            pageTitle: document.getElementById('pageTitle'),
            pageSubtitle: document.getElementById('pageSubtitle'),
            refreshBtn: document.getElementById('refreshBtn'),
            backBtn: document.getElementById('backBtn'),
            toolbarHint: document.getElementById('toolbarHint'),
            newFolderBtn: document.getElementById('newFolderBtn'),
            uploadToggleBtn: document.getElementById('uploadToggleBtn'),
            searchInput: document.getElementById('searchInput'),
            sortSelect: document.getElementById('sortSelect'),
            listViewBtn: document.getElementById('listViewBtn'),
            gridViewBtn: document.getElementById('gridViewBtn'),
            breadcrumb: document.getElementById('breadcrumb'),
            selectionBar: document.getElementById('selectionBar'),
            selectionCount: document.getElementById('selectionCount'),
            selectAllBtn: document.getElementById('selectAllBtn'),
            deselectAllBtn: document.getElementById('deselectAllBtn'),
            deleteSelectedBtn: document.getElementById('deleteSelectedBtn'),
            downloadSelectedBtn: document.getElementById('downloadSelectedBtn'),
            renameSelectedBtn: document.getElementById('renameSelectedBtn'),
            moveSelectedBtn: document.getElementById('moveSelectedBtn'),
            loadingState: document.getElementById('loadingState'),
            loadingText: document.getElementById('loadingText'),
            errorState: document.getElementById('errorState'),
            errorText: document.getElementById('errorText'),
            retryBtn: document.getElementById('retryBtn'),
            emptyState: document.getElementById('emptyState'),
            emptyText: document.getElementById('emptyText'),
            fileList: document.getElementById('fileList'),
            contentArea: document.getElementById('contentArea'),
            dropOverlay: document.getElementById('dropOverlay'),
            dropOverlayTitle: document.getElementById('dropOverlayTitle'),
            dropOverlayHint: document.getElementById('dropOverlayHint'),
            contextMenu: document.getElementById('contextMenu'),
            uploadQueue: document.getElementById('uploadQueue'),
            uploadPanel: document.getElementById('uploadPanel'),
            uploadSummary: document.getElementById('uploadSummary'),
            uploadArea: document.getElementById('uploadArea'),
            uploadHint: document.getElementById('uploadHint'),
            fileInput: document.getElementById('fileInput'),
            selectFilesBtn: document.getElementById('selectFilesBtn'),
            progressContainer: document.getElementById('progressContainer'),
            progressFill: document.getElementById('progressFill'),
            progressText: document.getElementById('progressText'),
            folderModal: document.getElementById('folderModal'),
            folderModalTitle: document.getElementById('folderModalTitle'),
            folderNameInput: document.getElementById('folderNameInput'),
            folderConfirmBtn: document.getElementById('folderConfirmBtn'),
            renameModal: document.getElementById('renameModal'),
            renameModalTitle: document.getElementById('renameModalTitle'),
            renameInput: document.getElementById('renameInput'),
            renameConfirmBtn: document.getElementById('renameConfirmBtn'),
            moveModal: document.getElementById('moveModal'),
            moveModalTitle: document.getElementById('moveModalTitle'),
            moveHint: document.getElementById('moveHint'),
            moveList: document.getElementById('moveList'),
            moveConfirmBtn: document.getElementById('moveConfirmBtn'),
            confirmModal: document.getElementById('confirmModal'),
            confirmTitle: document.getElementById('confirmTitle'),
            confirmMessage: document.getElementById('confirmMessage'),
            confirmHint: document.getElementById('confirmHint'),
            confirmOkBtn: document.getElementById('confirmOkBtn'),
            toastContainer: document.getElementById('toastContainer'),
        };

        function isExternalFileDrag(dt) {
            if (!dt) return false;
            return [...dt.types].some(type => type === 'Files' || type === 'application/x-moz-file');
        }

        function isInternalDrag(dt) {
            return dt && dt.types.includes(FM_PATH_TYPE);
        }

        function folderDisplayName(path) {
            if (!path) return t('home');
            const parts = path.split('/').filter(Boolean);
            return parts[parts.length - 1] || t('home');
        }

        function sortIndicator(column) {
            if (state.sortBy !== column) return '';
            return state.sortAsc ? '▲' : '▼';
        }

        function updateToolbarChrome() {
            els.backBtn.disabled = !state.currentPath;
            els.backBtn.title = t('go_up');
            els.toolbarHint.textContent = t('wifi_drag_tip');
            els.dropOverlayTitle.textContent = t('drop_to_upload_folder');
            els.dropOverlayHint.textContent = t('drag_onto_folder_upload');
        }

        function clearDropTargets() {
            els.fileList.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
        }

        function setFolderDropTarget(el, folderPath, mode) {
            clearDropTargets();
            el.classList.add('drop-target');
            const hint = mode === 'move'
                ? t('drag_move_to_folder', { folder: folderDisplayName(folderPath) })
                : t('release_upload_to_folder', { folder: folderDisplayName(folderPath) });
            el.dataset.dropHint = hint;
        }

        function hideDropOverlay() {
            state.externalDragDepth = 0;
            els.dropOverlay.classList.remove('visible');
            clearDropTargets();
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            els.toastContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 3200);
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function fileIcon(item) {
            if (item.type === 'folder') return '📁';
            const ext = item.name.split('.').pop().toLowerCase();
            const map = {
                mp4: '🎬', mov: '🎬', m4v: '🎬', avi: '🎬', mkv: '🎬',
                mp3: '🎵', m4a: '🎵', wav: '🎵', flac: '🎵', aac: '🎵',
                jpg: '🖼️', jpeg: '🖼️', png: '🖼️', gif: '🖼️', webp: '🖼️',
                pdf: '📄', doc: '📝', docx: '📝', txt: '📝',
                zip: '🗜️', rar: '🗜️',
            };
            return map[ext] || '📄';
        }

        function formatSize(bytes) {
            if (bytes == null) return '—';
            if (bytes === 0) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return `${(bytes / Math.pow(1024, i)).toFixed(i ? 1 : 0)} ${units[i]}`;
        }

        function formatDate(iso) {
            if (!iso) return '—';
            try {
                const d = new Date(iso);
                if (Number.isNaN(d.getTime())) return iso;
                const pad = (n) => String(n).padStart(2, '0');
                return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
            } catch {
                return iso;
            }
        }

        function formatDateFull(iso) {
            if (!iso) return '—';
            try { return new Date(iso).toLocaleString(); } catch { return iso; }
        }

        function itemCountLabel(count) {
            if (count === 1) return t('1_item');
            return t('items', { n: count });
        }

        function applyLocalization() {
            document.title = t('wi_fi_file_manager');
            els.pageTitle.textContent = t('wi_fi_file_manager');
            els.pageSubtitle.textContent = t('wifi_manager_subtitle');
            els.newFolderBtn.textContent = '📁 ' + t('new_folder');
            els.uploadToggleBtn.textContent = '📤 ' + t('upload_to_this_folder');
            els.searchInput.placeholder = t('search_file_name');
            els.loadingText.textContent = t('loading');
            els.retryBtn.textContent = t('retry');
            els.emptyText.textContent = t('this_folder_is_empty');
            els.uploadSummary.textContent = t('upload_to_this_folder');
            els.uploadHint.textContent = t('drag_or_click_upload');
            els.selectFilesBtn.textContent = t('select_files');
            els.selectAllBtn.textContent = t('select_all');
            els.deselectAllBtn.textContent = t('deselect_all');
            els.deleteSelectedBtn.textContent = t('delete_selected');
            els.folderModalTitle.textContent = t('new_folder');
            els.renameModalTitle.textContent = t('rename');
            els.moveModalTitle.textContent = t('move');
            els.moveHint.textContent = t('choose_destination_folder');
            els.moveConfirmBtn.textContent = t('move_here');
            els.confirmOkBtn.textContent = t('confirm');
            document.querySelectorAll('[data-close-modal]').forEach(btn => {
                btn.textContent = t('cancel');
            });
            els.folderConfirmBtn.textContent = t('confirm');
            els.renameConfirmBtn.textContent = t('confirm');

            els.sortSelect.innerHTML = `
                <option value="name">${t('sort_by_name')}</option>
                <option value="size">${t('sort_by_size')}</option>
                <option value="date">${t('sort_by_date')}</option>
            `;
            els.sortSelect.value = state.sortBy;
            els.listViewBtn.textContent = '☰';
            els.listViewBtn.title = t('list_view');
            els.gridViewBtn.textContent = '▦';
            els.gridViewBtn.title = t('grid_view');
            els.refreshBtn.title = t('refresh');
            updateToolbarChrome();
        }

        function setViewMode(mode) {
            state.viewMode = mode;
            localStorage.setItem('fm_view', mode);
            els.listViewBtn.classList.toggle('active', mode === 'list');
            els.gridViewBtn.classList.toggle('active', mode === 'grid');
            els.fileList.className = `file-list ${mode}-view visible`;
            renderItems();
        }

        function sortItems(items) {
            const sorted = [...items];
            const dir = state.sortAsc ? 1 : -1;
            sorted.sort((a, b) => {
                if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
                if (state.sortBy === 'size') return ((a.size || 0) - (b.size || 0)) * dir;
                if (state.sortBy === 'date') return ((new Date(a.modifiedAt || 0)) - (new Date(b.modifiedAt || 0))) * dir;
                return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }) * dir;
            });
            return sorted;
        }

        function filterItems() {
            const q = els.searchInput.value.trim().toLowerCase();
            state.filteredItems = q
                ? state.items.filter(item => item.name.toLowerCase().includes(q))
                : [...state.items];
            state.filteredItems = sortItems(state.filteredItems);
        }

        function updateSelectionUI() {
            const count = state.selected.size;
            els.selectionBar.classList.toggle('visible', count > 0);
            els.selectionCount.textContent = t('selected_items', { count });
            els.deleteSelectedBtn.disabled = count === 0;

            const singlePath = count === 1 ? [...state.selected][0] : null;
            const singleItem = singlePath ? state.items.find(i => i.path === singlePath) : null;
            const showSingle = !!singleItem;
            els.downloadSelectedBtn.classList.toggle('hidden', !(showSingle && singleItem.type === 'file'));
            els.renameSelectedBtn.classList.toggle('hidden', !showSingle);
            els.moveSelectedBtn.classList.toggle('hidden', !showSingle);
            if (showSingle) {
                els.downloadSelectedBtn.textContent = t('download');
                els.renameSelectedBtn.textContent = t('rename');
                els.moveSelectedBtn.textContent = t('move');
            }
        }

        function renderBreadcrumb() {
            const parts = state.currentPath ? state.currentPath.split('/').filter(Boolean) : [];
            let html = `<button type="button" data-nav="">${t('home')}</button>`;
            let acc = '';
            parts.forEach((part, index) => {
                acc += (acc ? '/' : '') + part;
                const path = acc;
                if (index === parts.length - 1) {
                    html += `<span class="sep">/</span><span class="current">${escapeHtml(part)}</span>`;
                } else {
                    html += `<span class="sep">/</span><button type="button" data-nav="${escapeHtml(path)}">${escapeHtml(part)}</button>`;
                }
            });
            els.breadcrumb.innerHTML = html;
            els.breadcrumb.querySelectorAll('[data-nav]').forEach(btn => {
                btn.addEventListener('click', () => navigateTo(btn.dataset.nav || ''));
            });
        }

        function renderItems() {
            filterItems();
            updateSelectionUI();

            if (state.loading) return;

            const items = state.filteredItems;
            els.emptyState.classList.toggle('visible', items.length === 0);
            els.fileList.classList.toggle('visible', items.length > 0);

            if (state.viewMode === 'list') {
                let html = `
                    <div class="file-row header-row">
                        <span class="col-check"></span>
                        <span></span>
                        <span class="col-name sortable" data-sort="name">${t('file_name')} <span class="sort-indicator">${sortIndicator('name')}</span></span>
                        <span class="col-size sortable" data-sort="size">${t('size')} <span class="sort-indicator">${sortIndicator('size')}</span></span>
                        <span class="col-date sortable" data-sort="date">${t('modified')} <span class="sort-indicator">${sortIndicator('date')}</span></span>
                        <span></span>
                    </div>`;
                items.forEach(item => {
                    const selected = state.selected.has(item.path);
                    const meta = item.type === 'folder'
                        ? itemCountLabel(item.itemCount || 0)
                        : formatSize(item.size);
                    const draggable = item.type === 'file' || item.type === 'folder';
                    html += `
                        <div class="file-row ${selected ? 'selected' : ''}" data-path="${escapeHtml(item.path)}" data-type="${item.type}" ${draggable ? 'draggable="true"' : ''}>
                            <span class="col-check"><input type="checkbox" class="checkbox" ${selected ? 'checked' : ''} data-select="${escapeHtml(item.path)}" onclick="event.stopPropagation()"></span>
                            <span class="file-row-icon" aria-hidden="true">${fileIcon(item)}</span>
                            <div class="col-name">
                                <div class="file-name">${escapeHtml(item.name)}</div>
                                <div class="file-meta mobile-only">${meta} · ${formatDate(item.modifiedAt)}</div>
                            </div>
                            <span class="col-size">${meta}</span>
                            <span class="col-date" title="${escapeHtml(formatDateFull(item.modifiedAt))}">${formatDate(item.modifiedAt)}</span>
                            <div class="row-actions">
                                ${item.type === 'file' ? `<button class="btn btn-secondary" data-download="${escapeHtml(item.path)}">${t('download')}</button>` : ''}
                                <button class="btn btn-secondary" data-rename="${escapeHtml(item.path)}" data-name="${escapeHtml(item.name)}">${t('rename')}</button>
                                <button class="btn btn-secondary" data-move="${escapeHtml(item.path)}">${t('move')}</button>
                                <button class="btn btn-danger" data-delete="${escapeHtml(item.path)}" data-name="${escapeHtml(item.name)}" data-type="${item.type}">${t('delete')}</button>
                            </div>
                        </div>`;
                });
                els.fileList.innerHTML = html;
            } else {
                els.fileList.innerHTML = items.map(item => {
                    const selected = state.selected.has(item.path);
                    const meta = item.type === 'folder'
                        ? itemCountLabel(item.itemCount || 0)
                        : formatSize(item.size);
                    const draggable = item.type === 'file' || item.type === 'folder';
                    return `
                        <div class="file-card ${selected ? 'selected' : ''}" data-path="${escapeHtml(item.path)}" data-type="${item.type}" ${draggable ? 'draggable="true"' : ''}>
                            <input type="checkbox" class="checkbox" style="position:absolute;top:10px;right:10px;" ${selected ? 'checked' : ''} data-select="${escapeHtml(item.path)}" onclick="event.stopPropagation()">
                            <div class="file-icon">${fileIcon(item)}</div>
                            <div class="file-name">${escapeHtml(item.name)}</div>
                            <div class="file-meta">${meta}</div>
                        </div>`;
                }).join('');
            }

            bindItemEvents();
        }

        function bindItemEvents() {
            els.fileList.querySelectorAll('.header-row [data-sort]').forEach(header => {
                header.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const col = header.dataset.sort;
                    if (state.sortBy === col) state.sortAsc = !state.sortAsc;
                    else {
                        state.sortBy = col;
                        state.sortAsc = true;
                    }
                    localStorage.setItem('fm_sort', state.sortBy);
                    localStorage.setItem('fm_sortAsc', state.sortAsc ? 'true' : 'false');
                    els.sortSelect.value = state.sortBy;
                    renderItems();
                });
            });

            els.fileList.querySelectorAll('[data-path]').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (e.target.closest('.row-actions') || e.target.matches('.checkbox, [data-select]')) return;
                    const path = el.dataset.path;
                    const type = el.dataset.type;
                    if (type === 'folder') navigateTo(path);
                });

                el.addEventListener('dblclick', (e) => {
                    if (e.target.closest('.row-actions') || e.target.matches('.checkbox, [data-select]')) return;
                    const path = el.dataset.path;
                    const type = el.dataset.type;
                    if (type === 'folder') navigateTo(path);
                    else if (type === 'file') {
                        window.location.href = `/download?path=${encodeURIComponent(path)}`;
                    }
                });

                el.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    const path = el.dataset.path;
                    const item = state.items.find(i => i.path === path);
                    if (item) openContextMenu(e.clientX, e.clientY, item);
                });

                if (el.dataset.type === 'folder') bindFolderDropTarget(el);
                if (el.draggable) bindInternalDragSource(el);
            });

            els.fileList.querySelectorAll('[data-select]').forEach(cb => {
                cb.addEventListener('change', () => {
                    const path = cb.dataset.select;
                    if (cb.checked) state.selected.add(path);
                    else state.selected.delete(path);
                    renderItems();
                });
            });

            els.fileList.querySelectorAll('[data-download]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    window.location.href = `/download?path=${encodeURIComponent(btn.dataset.download)}`;
                });
            });

            els.fileList.querySelectorAll('[data-rename]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openRenameModal(btn.dataset.rename, btn.dataset.name);
                });
            });

            els.fileList.querySelectorAll('[data-move]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openMoveModal(btn.dataset.move);
                });
            });

            els.fileList.querySelectorAll('[data-delete]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    confirmDelete([btn.dataset.delete], btn.dataset.name, btn.dataset.type);
                });
            });
        }

        function bindFolderDropTarget(el) {
            const folderPath = el.dataset.path;

            el.addEventListener('dragenter', (e) => {
                if (isExternalFileDrag(e.dataTransfer) || isInternalDrag(e.dataTransfer)) {
                    e.preventDefault();
                    e.stopPropagation();
                    const mode = isInternalDrag(e.dataTransfer) ? 'move' : 'upload';
                    setFolderDropTarget(el, folderPath, mode);
                }
            });

            el.addEventListener('dragover', (e) => {
                if (isExternalFileDrag(e.dataTransfer) || isInternalDrag(e.dataTransfer)) {
                    e.preventDefault();
                    e.stopPropagation();
                    e.dataTransfer.dropEffect = isInternalDrag(e.dataTransfer) ? 'move' : 'copy';
                }
            });

            el.addEventListener('dragleave', (e) => {
                if (!el.contains(e.relatedTarget)) el.classList.remove('drop-target');
            });

            el.addEventListener('drop', async (e) => {
                e.preventDefault();
                e.stopPropagation();
                hideDropOverlay();
                clearDropTargets();

                if (isInternalDrag(e.dataTransfer)) {
                    const sourcePath = e.dataTransfer.getData(FM_PATH_TYPE);
                    if (sourcePath && sourcePath !== folderPath) {
                        await moveItemToFolder(sourcePath, folderPath);
                    }
                    return;
                }

                if (isExternalFileDrag(e.dataTransfer)) {
                    const files = [...e.dataTransfer.files];
                    if (files.length) uploadFiles(files, folderPath);
                }
            });
        }

        function bindInternalDragSource(el) {
            el.addEventListener('dragstart', (e) => {
                if (e.target.matches('.checkbox, [data-select]') || e.target.closest('.row-actions')) {
                    e.preventDefault();
                    return;
                }
                const path = el.dataset.path;
                state.internalDragPath = path;
                el.classList.add('dragging');
                e.dataTransfer.setData(FM_PATH_TYPE, path);
                e.dataTransfer.effectAllowed = 'move';
            });

            el.addEventListener('dragend', () => {
                state.internalDragPath = null;
                el.classList.remove('dragging');
                clearDropTargets();
                hideDropOverlay();
            });
        }

        function openContextMenu(x, y, item) {
            state.contextTarget = item;
            const actions = [];
            if (item.type === 'folder') {
                actions.push({ id: 'open', label: '📂 ' + t('open_folder'), run: () => navigateTo(item.path) });
            } else {
                actions.push({ id: 'download', label: '⬇ ' + t('download'), run: () => { window.location.href = `/download?path=${encodeURIComponent(item.path)}`; } });
            }
            actions.push(
                { id: 'rename', label: '✏️ ' + t('rename'), run: () => openRenameModal(item.path, item.name) },
                { id: 'move', label: '📦 ' + t('move'), run: () => openMoveModal(item.path) },
                { id: 'delete', label: '🗑 ' + t('delete'), danger: true, run: () => confirmDelete([item.path], item.name, item.type) },
            );

            els.contextMenu.innerHTML = actions.map(a =>
                `<button type="button" class="${a.danger ? 'danger' : ''}" data-action="${a.id}">${escapeHtml(a.label)}</button>`
            ).join('<hr>');

            els.contextMenu.querySelectorAll('[data-action]').forEach(btn => {
                const action = actions.find(a => a.id === btn.dataset.action);
                btn.addEventListener('click', () => {
                    closeContextMenu();
                    action?.run();
                });
            });

            els.contextMenu.classList.add('visible');
            const rect = els.contextMenu.getBoundingClientRect();
            const left = Math.min(x, window.innerWidth - rect.width - 8);
            const top = Math.min(y, window.innerHeight - rect.height - 8);
            els.contextMenu.style.left = `${Math.max(8, left)}px`;
            els.contextMenu.style.top = `${Math.max(8, top)}px`;
        }

        function closeContextMenu() {
            els.contextMenu.classList.remove('visible');
            state.contextTarget = null;
        }

        async function moveItemToFolder(sourcePath, destinationFolderPath) {
            if (!sourcePath || sourcePath === destinationFolderPath) return;
            if (destinationFolderPath.startsWith(sourcePath + '/')) {
                showToast(t('cannot_move_folder_into_self'), 'error');
                return;
            }
            try {
                const res = await fetch('/api/move', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sourcePath, destinationPath: destinationFolderPath }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed');
                showToast(t('moved_successfully'), 'success');
                loadDirectory(state.currentPath);
            } catch (err) {
                showToast(t('move_failed', { message: err.message }), 'error');
            }
        }

        function setLoading(loading) {
            state.loading = loading;
            els.loadingState.classList.toggle('visible', loading);
            els.errorState.classList.remove('visible');
            if (loading) {
                els.emptyState.classList.remove('visible');
                els.fileList.classList.remove('visible');
            }
        }

        function showError(message) {
            state.loading = false;
            els.loadingState.classList.remove('visible');
            els.errorState.classList.add('visible');
            els.errorText.textContent = message;
            els.fileList.classList.remove('visible');
            els.emptyState.classList.remove('visible');
        }

        async function loadDirectory(path = state.currentPath, retries = 2) {
            setLoading(true);
            state.selected.clear();
            try {
                const query = path ? `?path=${encodeURIComponent(path)}` : '';
                const res = await fetch(`/api/files${query}`, { cache: 'no-store' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                state.currentPath = data.path || '';
                state.parentPath = data.parent || '';
                state.items = data.items || [];
                state.loading = false;
                els.loadingState.classList.remove('visible');
                els.errorState.classList.remove('visible');
                updateToolbarChrome();
                renderBreadcrumb();
                renderItems();
            } catch (err) {
                if (retries > 0) {
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    return loadDirectory(path, retries - 1);
                }
                showError(err.message);
            }
        }

        function navigateTo(path) {
            loadDirectory(path);
        }

        function navigateUp() {
            if (state.currentPath) loadDirectory(state.parentPath || '');
        }

        function renderUploadQueue() {
            const jobs = [...state.uploadJobs.values()];
            els.uploadQueue.classList.toggle('visible', jobs.length > 0);
            if (!jobs.length) {
                els.uploadQueue.innerHTML = '';
                return;
            }
            const title = jobs.length === 1
                ? t('1_upload_in_progress')
                : t('uploads_in_progress', { count: jobs.length });
            els.uploadQueue.innerHTML = `<div class="upload-job"><div class="upload-job-title">${escapeHtml(title)}</div></div>` +
                jobs.map(job => `
                    <div class="upload-job">
                        <div class="upload-job-title">${escapeHtml(job.label)}</div>
                        <div class="progress-bar"><div class="progress-fill" style="width:${job.progress}%"></div></div>
                        <div class="upload-job-meta">${escapeHtml(job.detail)}</div>
                    </div>
                `).join('');
        }

        function openModal(modal) {
            modal.classList.add('visible');
        }

        function closeModals() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('visible'));
        }

        function openFolderModal() {
            els.folderNameInput.value = '';
            openModal(els.folderModal);
            setTimeout(() => els.folderNameInput.focus(), 100);
        }

        async function createFolder() {
            const name = els.folderNameInput.value.trim();
            if (!name) return;
            try {
                const res = await fetch('/api/folder', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: state.currentPath, name }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed');
                closeModals();
                showToast(t('folder_created'), 'success');
                loadDirectory(state.currentPath);
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        function openRenameModal(path, name) {
            state.renamePath = path;
            els.renameInput.value = name;
            openModal(els.renameModal);
            setTimeout(() => { els.renameInput.focus(); els.renameInput.select(); }, 100);
        }

        async function confirmRename() {
            const newName = els.renameInput.value.trim();
            if (!newName || !state.renamePath) return;
            try {
                const res = await fetch('/api/rename', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: state.renamePath, newName }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed');
                closeModals();
                showToast(t('renamed_successfully'), 'success');
                loadDirectory(state.currentPath);
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function loadMoveFolders(basePath = '') {
            const query = basePath ? `?path=${encodeURIComponent(basePath)}` : '';
            const res = await fetch(`/api/files${query}`);
            const data = await res.json();
            state.moveTargetPath = data.path || '';
            const folders = (data.items || []).filter(i => i.type === 'folder');
            let html = `
                <div class="move-item active" data-move-target="">
                    📂 ${t('move_here')} — ${state.moveTargetPath || t('home')}
                </div>`;
            if (basePath) {
                html += `
                    <div class="move-item" data-move-nav="${escapeHtml(data.parent || '')}">
                        ↩ ${t('parent_folder')}
                    </div>`;
            }
            folders.forEach(folder => {
                html += `
                    <div class="move-item" data-move-nav="${escapeHtml(folder.path)}">
                        📁 ${escapeHtml(folder.name)}
                    </div>`;
            });
            els.moveList.innerHTML = html;
            els.moveList.querySelector('[data-move-target]')?.addEventListener('click', () => {});
            els.moveList.querySelectorAll('[data-move-nav]').forEach(item => {
                item.addEventListener('click', () => loadMoveFolders(item.dataset.moveNav || ''));
            });
        }

        function openMoveModal(sourcePath) {
            state.moveSourcePath = sourcePath;
            openModal(els.moveModal);
            loadMoveFolders('');
        }

        async function confirmMove() {
            if (!state.moveSourcePath) return;
            try {
                const res = await fetch('/api/move', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sourcePath: state.moveSourcePath,
                        destinationPath: state.moveTargetPath,
                    }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed');
                closeModals();
                showToast(t('moved_successfully'), 'success');
                loadDirectory(state.currentPath);
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        let confirmAction = null;

        function confirmDelete(paths, name, type) {
            els.confirmTitle.textContent = t('delete');
            if (paths.length === 1) {
                els.confirmMessage.textContent = t('confirm_delete_filename', { filename: name });
            } else {
                els.confirmMessage.textContent = t('confirm_delete_items', { count: paths.length });
            }
            const hasFolder = type === 'folder' || paths.some(p => {
                const item = state.items.find(i => i.path === p);
                return item && item.type === 'folder';
            });
            els.confirmHint.style.display = hasFolder ? 'block' : 'none';
            if (hasFolder) els.confirmHint.textContent = t('deleting_folder_removes_contents');
            confirmAction = async () => {
                try {
                    const res = await fetch('/api/delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ paths }),
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Failed');
                    closeModals();
                    showToast(t('deleted_successfully'), 'success');
                    loadDirectory(state.currentPath);
                } catch (err) {
                    showToast(err.message, 'error');
                }
            };
            openModal(els.confirmModal);
        }

        function uploadFiles(files, targetPath = state.currentPath) {
            if (!files.length) return;
            const formData = new FormData();
            for (const file of files) formData.append('files', file);

            const jobId = `job-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
            const label = files.length === 1
                ? files[0].name
                : t('files_count', { count: files.length });
            const destLabel = folderDisplayName(targetPath);
            state.uploadJobs.set(jobId, {
                label: `${label} → ${destLabel}`,
                progress: 0,
                detail: t('uploading'),
            });
            renderUploadQueue();

            els.progressContainer.classList.add('visible');
            els.progressFill.style.width = '0%';
            els.progressText.textContent = t('uploading') + ' 0%';
            els.uploadPanel.open = true;

            const pathQuery = targetPath ? `?path=${encodeURIComponent(targetPath)}` : '';
            fetch(`/upload${pathQuery}`, { method: 'POST', body: formData })
                .then(r => r.json())
                .then(data => {
                    if (data.uploadId) monitorProgress(data.uploadId, jobId, targetPath);
                    else throw new Error('No upload id');
                })
                .catch(err => {
                    state.uploadJobs.delete(jobId);
                    renderUploadQueue();
                    showToast(t('upload_failed', { message: err.message }), 'error');
                });
        }

        function monitorProgress(uploadId, jobId, targetPath) {
            let retryCount = 0;
            let lastCompleted = 0;

            const check = () => {
                fetch(`/progress/${uploadId}`)
                    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
                    .then(data => {
                        retryCount = 0;
                        if (data.error) throw new Error(data.error);
                        const pct = data.progressPercentage || 0;
                        els.progressFill.style.width = pct + '%';
                        els.progressText.textContent = t('uploading_files', {
                            progress: pct,
                            current: data.completedFiles || 0,
                            total: data.totalFiles || 0,
                        });
                        if (state.uploadJobs.has(jobId)) {
                            state.uploadJobs.set(jobId, {
                                ...state.uploadJobs.get(jobId),
                                progress: pct,
                                detail: t('uploading_files', {
                                    progress: pct,
                                    current: data.completedFiles || 0,
                                    total: data.totalFiles || 0,
                                }),
                            });
                            renderUploadQueue();
                        }
                        if ((data.completedFiles || 0) > lastCompleted) {
                            lastCompleted = data.completedFiles;
                            if (targetPath === state.currentPath) loadDirectory(state.currentPath);
                        }
                        if (data.isCompleted) {
                            showToast(t('upload_completed_successfully'), 'success');
                            loadDirectory(state.currentPath);
                            state.uploadJobs.delete(jobId);
                            renderUploadQueue();
                            setTimeout(() => {
                                if (state.uploadJobs.size === 0) {
                                    els.progressContainer.classList.remove('visible');
                                }
                            }, 1500);
                        } else {
                            setTimeout(check, 200);
                        }
                    })
                    .catch(err => {
                        if (String(err.message).includes('404') && retryCount < 3) {
                            retryCount++;
                            setTimeout(check, 1000);
                        } else {
                            state.uploadJobs.delete(jobId);
                            renderUploadQueue();
                            showToast(t('progress_check_failed', { message: err.message }), 'error');
                            els.progressContainer.classList.remove('visible');
                        }
                    });
            };
            setTimeout(check, 200);
        }

        function setupGlobalDragAndDrop() {
            const area = els.contentArea;

            area.addEventListener('dragenter', (e) => {
                if (!isExternalFileDrag(e.dataTransfer)) return;
                e.preventDefault();
                state.externalDragDepth += 1;
                els.dropOverlay.classList.add('visible');
            });

            area.addEventListener('dragover', (e) => {
                if (isExternalFileDrag(e.dataTransfer)) e.preventDefault();
            });

            area.addEventListener('dragleave', (e) => {
                if (!isExternalFileDrag(e.dataTransfer)) return;
                if (e.relatedTarget && area.contains(e.relatedTarget)) return;
                state.externalDragDepth = Math.max(0, state.externalDragDepth - 1);
                if (state.externalDragDepth === 0) els.dropOverlay.classList.remove('visible');
            });

            area.addEventListener('drop', (e) => {
                if (!isExternalFileDrag(e.dataTransfer)) return;
                if (e.target.closest('[data-type="folder"]')) return;
                e.preventDefault();
                hideDropOverlay();
                const files = [...e.dataTransfer.files];
                if (files.length) uploadFiles(files, state.currentPath);
            });

            document.addEventListener('dragend', hideDropOverlay);
            document.addEventListener('drop', (e) => {
                if (!e.target.closest('#contentArea')) hideDropOverlay();
            });
        }

        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                const tag = (e.target.tagName || '').toLowerCase();
                const typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
                if (e.key === 'Escape') {
                    closeContextMenu();
                    closeModals();
                    if (state.selected.size) {
                        state.selected.clear();
                        renderItems();
                    }
                    return;
                }
                if (typing) return;
                if ((e.key === 'Delete' || e.key === 'Backspace') && state.selected.size > 0) {
                    e.preventDefault();
                    const paths = [...state.selected];
                    confirmDelete(paths, '', 'mixed');
                }
                if (e.key === 'F5') return;
                if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'a') {
                    e.preventDefault();
                    state.filteredItems.forEach(i => state.selected.add(i.path));
                    renderItems();
                }
            });
        }

        function bindEvents() {
            els.refreshBtn.addEventListener('click', () => loadDirectory(state.currentPath));
            els.backBtn.addEventListener('click', navigateUp);
            els.retryBtn.addEventListener('click', () => loadDirectory(state.currentPath));
            els.newFolderBtn.addEventListener('click', openFolderModal);
            els.uploadToggleBtn.addEventListener('click', () => {
                els.uploadPanel.open = !els.uploadPanel.open;
                els.uploadPanel.scrollIntoView({ behavior: 'smooth', block: 'end' });
            });
            els.folderConfirmBtn.addEventListener('click', createFolder);
            els.renameConfirmBtn.addEventListener('click', confirmRename);
            els.moveConfirmBtn.addEventListener('click', confirmMove);
            els.confirmOkBtn.addEventListener('click', () => { if (confirmAction) confirmAction(); });

            document.querySelectorAll('[data-close-modal]').forEach(btn => {
                btn.addEventListener('click', closeModals);
            });
            document.querySelectorAll('.modal-overlay').forEach(overlay => {
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) closeModals();
                });
            });

            els.searchInput.addEventListener('input', renderItems);
            els.sortSelect.addEventListener('change', () => {
                state.sortBy = els.sortSelect.value;
                localStorage.setItem('fm_sort', state.sortBy);
                renderItems();
            });
            els.listViewBtn.addEventListener('click', () => setViewMode('list'));
            els.gridViewBtn.addEventListener('click', () => setViewMode('grid'));

            els.selectAllBtn.addEventListener('click', () => {
                state.filteredItems.forEach(i => state.selected.add(i.path));
                renderItems();
            });
            els.deselectAllBtn.addEventListener('click', () => {
                state.selected.clear();
                renderItems();
            });
            els.deleteSelectedBtn.addEventListener('click', () => {
                const paths = [...state.selected];
                confirmDelete(paths, '', 'mixed');
            });
            els.downloadSelectedBtn.addEventListener('click', () => {
                const path = [...state.selected][0];
                if (path) window.location.href = `/download?path=${encodeURIComponent(path)}`;
            });
            els.renameSelectedBtn.addEventListener('click', () => {
                const path = [...state.selected][0];
                const item = state.items.find(i => i.path === path);
                if (item) openRenameModal(item.path, item.name);
            });
            els.moveSelectedBtn.addEventListener('click', () => {
                const path = [...state.selected][0];
                if (path) openMoveModal(path);
            });

            els.selectFilesBtn.addEventListener('click', () => els.fileInput.click());
            els.fileInput.addEventListener('change', e => {
                uploadFiles([...e.target.files]);
                e.target.value = '';
            });
            els.uploadArea.addEventListener('dragover', e => { e.preventDefault(); els.uploadArea.classList.add('dragover'); });
            els.uploadArea.addEventListener('dragleave', () => els.uploadArea.classList.remove('dragover'));
            els.uploadArea.addEventListener('drop', e => {
                e.preventDefault();
                e.stopPropagation();
                els.uploadArea.classList.remove('dragover');
                uploadFiles([...e.dataTransfer.files], state.currentPath);
            });

            document.addEventListener('paste', (e) => {
                const files = [...(e.clipboardData?.files || [])];
                if (files.length) {
                    e.preventDefault();
                    uploadFiles(files, state.currentPath);
                }
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('#contextMenu')) closeContextMenu();
            });

            setupGlobalDragAndDrop();
            setupKeyboardShortcuts();

            els.folderNameInput.addEventListener('keydown', e => { if (e.key === 'Enter') createFolder(); });
            els.renameInput.addEventListener('keydown', e => { if (e.key === 'Enter') confirmRename(); });
        }

        applyLocalization();
        bindEvents();
        setViewMode(state.viewMode);
        loadDirectory(INITIAL_PATH || '');
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                loadDirectory(state.currentPath);
            }
        });
    </script>
</body>
</html>
